name: tnas-vms-pytest

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kmvms_pytest
      POSTGRES_USER: kmvms_pytest
      POSTGRES_PASSWORD: kmvms_pytest_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmvms_pytest -d kmvms_pytest"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend-pytest:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.test
    working_dir: /workspace
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      APP_ENV: production
      DATABASE_URL: sqlite:////tmp/kmvms-pytest/db.sqlite3
      JWT_SECRET: kmvms-pytest-jwt-secret-32-bytes-minimum
      ENCRYPTION_KEY: kmvms-pytest-encryption-key-32-bytes-minimum
      STORAGE_ROOT: /tmp/kmvms-pytest/archive
      STORAGE_PREVIEWS: /tmp/kmvms-pytest/previews
      STORAGE_EXPORTS: /tmp/kmvms-pytest/exports
      STORAGE_HOST_ROOT: ""
      SURVEILLANCE_ROOT: ""
      PYTEST_ADDOPTS: --cache-clear -p no:cacheprovider --basetemp=/tmp/kmvms-pytest/pytest
      KMVMS_STAGE2_POSTGRES_URL: ${KMVMS_STAGE2_POSTGRES_URL:-postgresql+psycopg://kmvms_pytest:kmvms_pytest_password@postgres-test:5432/kmvms_pytest}
      KMVMS_STAGE3_POSTGRES_URL: ${KMVMS_STAGE3_POSTGRES_URL:-postgresql+psycopg://kmvms_pytest:kmvms_pytest_password@postgres-test:5432/kmvms_pytest}
      KMVMS_STAGE1378_POSTGRES_URL: ${KMVMS_STAGE1378_POSTGRES_URL:-postgresql+psycopg://kmvms_pytest:kmvms_pytest_password@postgres-test:5432/kmvms_pytest}
      KMVMS_STAGE1378_BACKUP_ROOT: /stage1378-backups
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - .:/workspace:ro
    # Keep pytest temp files off the NAS overlay; several contract tests execute
    # generated command shims from tmp_path, so this isolated test mount is exec.
    tmpfs:
      - /tmp/kmvms-pytest:exec
      - /stage1378-backups
      - /stage1378-runtime
    command: ["pytest", "apps/api/tests"]
