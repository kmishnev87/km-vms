name: ${COMPOSE_PROJECT_NAME:-tnas-vms}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-postgres
    restart: always
    environment:
      POSTGRES_DB: vms
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - vms-net

  redis:
    image: redis:7-alpine
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - vms-net

  update-helper-bootstrap:
    image: km-vms-${COMPOSE_PROJECT_NAME:-tnas-vms}-update-helper:${KM_VMS_RELEASE_IMAGE_TAG:-local}
    build:
      context: ./apps/update-helper
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-update-helper-bootstrap
    restart: "no"
    working_dir: ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      KM_VMS_BOOTSTRAP_APP_DIR: ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}
      KM_VMS_BOOTSTRAP_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-tnas-vms}
      KM_VMS_BOOTSTRAP_HELPER_IMAGE: km-vms-${COMPOSE_PROJECT_NAME:-tnas-vms}-update-helper:${KM_VMS_RELEASE_IMAGE_TAG:-local}
      KM_VMS_BOOTSTRAP_TIMEOUT_SECONDS: ${KM_VMS_UPDATE_HELPER_REFRESH_TIMEOUT_SECONDS:-7800}
      KM_VMS_UPDATE_CONTROL_REQUEST_ID: ${KM_VMS_UPDATE_CONTROL_REQUEST_ID:-}
    command:
      - sh
      - -c
      - >-
        exec python3 -B
        "$${KM_VMS_BOOTSTRAP_APP_DIR}/data/update-runtime/bootstrap/current/km-vms-bootstrap.py"
        run-role update-helper-bootstrap
        --app-dir "$${KM_VMS_BOOTSTRAP_APP_DIR}"
        --project-name "$${KM_VMS_BOOTSTRAP_PROJECT_NAME}"
    volumes:
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}:${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

  update-status-reader:
    image: km-vms-${COMPOSE_PROJECT_NAME:-tnas-vms}-update-control:${KM_VMS_RELEASE_IMAGE_TAG:-local}
    build:
      context: ./apps/update-control-plane
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-update-status-reader
    restart: always
    depends_on:
      update-retry-admission:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KMVMS_CONTROL_ROLE: reader
      KMVMS_CONTROL_PORT: 8080
      KMVMS_UPDATE_CONTROL_ROOT: /update-control
      KMVMS_UPDATE_PUBLIC_ROOT: /update-public
      KMVMS_RESTORE_PUBLIC_ROOT: /restore-public
    volumes:
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/update-public:/update-public:ro
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/restore-public:/restore-public:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - vms-net

  update-retry-admission:
    image: km-vms-${COMPOSE_PROJECT_NAME:-tnas-vms}-update-control:${KM_VMS_RELEASE_IMAGE_TAG:-local}
    build:
      context: ./apps/update-control-plane
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-update-retry-admission
    restart: always
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KMVMS_CONTROL_ROLE: controller-retry
      KMVMS_CONTROL_PORT: 8080
      KMVMS_UPDATE_CONTROL_ROOT: /update-control
      KMVMS_UPDATE_PUBLIC_ROOT: /update-public
      KMVMS_RESTORE_CONTROL_ROOT: /restore-control
      KMVMS_MAINTENANCE_CONTROL_ROOT: /maintenance-control
      KMVMS_BACKUP_OPERATION_ROOT: /backup-operations
      KMVMS_TEST_FAULT_INJECTION: ${KMVMS_TEST_FAULT_INJECTION:-0}
      KMVMS_TEST_RETRY_FAILURE_MODE: ${KMVMS_TEST_RETRY_FAILURE_MODE:-}
    volumes:
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/update-control:/update-control
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/update-public:/update-public
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/restore-control:/restore-control:ro
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/maintenance-control:/maintenance-control
      - ${KMVMS_HOST_DB_BACKUP_ROOT:-${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/backups/db}/.kmvms-backup-operations:/backup-operations:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - vms-net

  schema-update:
    image: ${COMPOSE_PROJECT_NAME:-tnas-vms}-api:${KM_VMS_RELEASE_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-schema-update
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      update-helper-bootstrap:
        condition: service_completed_successfully
      update-status-reader:
        condition: service_healthy
      update-retry-admission:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://vms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/vms
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      STORAGE_ROOT: /storage/archive
      UPDATE_CONTROL_ROOT: /update-control
      KMVMS_DB_BACKUP_ROOT: ${KMVMS_DB_BACKUP_ROOT:-/storage/backups/db}
      KMVMS_RELEASE_IDENTITY_FILE: /app/.km-vms-release.json
      KMVMS_SOURCE_IDENTITY_FILE: /app/.km-vms-source.json
      KMVMS_TEST_FAULT_INJECTION: ${KMVMS_TEST_FAULT_INJECTION:-0}
      KMVMS_TEST_PREPARATION_FAILURE_MODE: ${KMVMS_TEST_PREPARATION_FAILURE_MODE:-}
      KMVMS_TEST_SCHEMA_FAILURE_MODE: ${KMVMS_TEST_SCHEMA_FAILURE_MODE:-}
      KMVMS_TARGET_SCHEMA_SHAPE_FINGERPRINT: ${KMVMS_TARGET_SCHEMA_SHAPE_FINGERPRINT:-}
    command: ["python3", "-m", "app.services.schema_update_pipeline"]
    volumes:
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/update-control:/update-control
      - ./release:/app/release:ro
      - ./.km-vms-release.json:/app/.km-vms-release.json:ro
      - ./.km-vms-source.json:/app/.km-vms-source.json:ro
      - ${SURVEILLANCE_ROOT}:/storage/archive
      - ${KMVMS_HOST_DB_BACKUP_ROOT:-${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/backups/db}:${KMVMS_DB_BACKUP_ROOT:-/storage/backups/db}
    networks:
      - vms-net

  api:
    image: ${COMPOSE_PROJECT_NAME:-tnas-vms}-api:${KM_VMS_RELEASE_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      update-helper-bootstrap:
        condition: service_completed_successfully
      schema-update:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://vms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/vms
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      STORAGE_ROOT: /storage/archive
      KMVMS_APP_ROOT: /app
      UPDATE_CONTROL_ROOT: /update-control
      RESTORE_CONTROL_ROOT: /restore-control
      RESTORE_PUBLIC_ROOT: /restore-public
      MAINTENANCE_CONTROL_ROOT: /maintenance-control
      KMVMS_RESTORE_STATUS_READER_HEALTH_URL: http://update-status-reader:8080/health
      KMVMS_UPDATE_MANIFEST_PATH: ${KMVMS_UPDATE_MANIFEST_PATH:-}
      KMVMS_UPDATE_CHANNEL_ID: ${KMVMS_UPDATE_CHANNEL_ID:-stable}
      KMVMS_UPDATE_HELPER_ENABLED: "true"
      KMVMS_INSTALLED_SLOT_PROJECTION_FILE: /installed-slot/installed-slot.json
      KMVMS_UPDATE_SOURCE_PRIVATE: ${KMVMS_UPDATE_SOURCE_PRIVATE:-false}
      KMVMS_UPDATE_TOKEN_CONFIGURED: ${KMVMS_UPDATE_TOKEN_CONFIGURED:-false}
      KMVMS_DB_BACKUP_ROOT: ${KMVMS_DB_BACKUP_ROOT:-/storage/backups/db}
      STORAGE_HOST_ROOT: ${SURVEILLANCE_ROOT:-}
      STORAGE_INSTALL_CONTROL: /install-control
      STORAGE_PREVIEWS: /storage/previews
      STORAGE_EXPORTS: /storage/exports
      DEFAULT_LIVE_STREAM: sub
      DEFAULT_RECORD_STREAM: main
      LIVE_TRANSCODE: "false"
      LIVE_VIDEO_CODEC: auto
      LIVE_TRANSCODE_PROFILE: stable
      LIVE_UNSTABLE_SOURCE_TARGET_FPS: 20
      LIVE_AUDIO_MODE: ${LIVE_AUDIO_MODE:-aac}
      LIVE_HWACCEL_MODE: ${LIVE_HWACCEL_MODE:-auto}
      LIVE_HWACCEL_BACKEND: ${LIVE_HWACCEL_BACKEND:-auto}
      LIVE_HWACCEL_DEVICE: ${LIVE_HWACCEL_DEVICE:-/dev/dri/renderD128}
      LIVE_IDLE_TTL_SECONDS: 45
      LIVE_CLEANUP_INTERVAL_SECONDS: 10
      LIVE_START_TIMEOUT_SECONDS: 20
      LIVE_MAX_CONCURRENT_TRANSCODES: 0
    volumes:
      - ${SURVEILLANCE_ROOT}:/storage/archive
      - ${KMVMS_HOST_DB_BACKUP_ROOT:-${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/backups/db}:${KMVMS_DB_BACKUP_ROOT:-/storage/backups/db}
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/install-control:/install-control
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/update-control:/update-control
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/restore-control:/restore-control
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/restore-public:/restore-public
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/maintenance-control:/maintenance-control
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/update-runtime/installed-projection:/installed-slot:ro
      - ./release:/app/release:ro
      - ./.km-vms-release.json:/app/.km-vms-release.json:ro
      - ./.km-vms-source.json:/app/.km-vms-source.json:ro
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/previews:/storage/previews
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/exports:/storage/exports
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    ports:
      - "${API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - vms-net

  restore-executor:
    image: ${COMPOSE_PROJECT_NAME:-tnas-vms}-api:${KM_VMS_RELEASE_IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: "no"
    profiles: ["current-db-restore"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python3", "-m", "app.services.current_db_restore_executor"]
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://vms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/vms
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      KMVMS_DB_BACKUP_ROOT: ${KMVMS_DB_BACKUP_ROOT:-/storage/backups/db}
      UPDATE_CONTROL_ROOT: /update-control
      RESTORE_CONTROL_ROOT: /restore-control
      RESTORE_PUBLIC_ROOT: /restore-public
      MAINTENANCE_CONTROL_ROOT: /maintenance-control
      KMVMS_TEST_FAULT_INJECTION: "0"
      KMVMS_RESTORE_TEST_FAILURE_PHASE: ""
    volumes:
      - ${KMVMS_HOST_DB_BACKUP_ROOT:-${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/backups/db}:${KMVMS_DB_BACKUP_ROOT:-/storage/backups/db}
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/update-control:/update-control:ro
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/restore-control:/restore-control
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/maintenance-control:/maintenance-control:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vms-net

  setup-helper:
    image: docker:27-cli
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-setup-helper
    restart: always
    depends_on:
      api:
        condition: service_started
    working_dir: ${KM_VMS_HOST_APP_DIR:-/host-app}
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      KM_VMS_SETUP_APP_DIR: ${KM_VMS_HOST_APP_DIR:-/host-app}
    command:
      - sh
      - -c
      - |
        exec sh
        "$${KM_VMS_SETUP_APP_DIR}/data/update-runtime/bootstrap/current/km-vms-bootstrap-dispatch.sh"
        setup-helper "$${KM_VMS_SETUP_APP_DIR}"
    volumes:
      - ${KM_VMS_HOST_APP_DIR:-.}:${KM_VMS_HOST_APP_DIR:-/host-app}
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vms-net

  update-helper:
    image: km-vms-${COMPOSE_PROJECT_NAME:-tnas-vms}-update-helper:${KM_VMS_RELEASE_IMAGE_TAG:-local}
    build:
      context: ./apps/update-helper
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-update-helper
    restart: always
    working_dir: /host-app
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      KM_VMS_UPDATE_APP_DIR: /host-app
      KM_VMS_UPDATE_HOST_APP_DIR: ${KM_VMS_HOST_APP_DIR:-}
      KM_VMS_GITHUB_PRIVATE: ${KMVMS_UPDATE_SOURCE_PRIVATE:-0}
      KMVMS_UPDATE_SOURCE_PRIVATE: ${KMVMS_UPDATE_SOURCE_PRIVATE:-0}
      KM_VMS_GITHUB_TOKEN_FILE: ${KM_VMS_GITHUB_TOKEN_FILE:-}
      KM_VMS_GITHUB_TOKEN: ${KM_VMS_GITHUB_TOKEN:-}
      KM_VMS_DOCKER_COMPOSE: ${KM_VMS_DOCKER_COMPOSE:-}
      KM_VMS_UPDATE_HELPER_DOCKER_COMPOSE: ${KM_VMS_UPDATE_HELPER_DOCKER_COMPOSE:-docker-compose}
      KM_VMS_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-tnas-vms}
    command:
      - sh
      - -c
      - >-
        exec python3 -B
        /host-app/data/update-runtime/bootstrap/current/km-vms-bootstrap.py
        run-role update-helper
        --app-dir /host-app
        --project-name "$${KM_VMS_PROJECT_NAME}"
    volumes:
      - ${KM_VMS_HOST_APP_DIR:-.}:/host-app
      - ${KM_VMS_HOST_APP_DIR:-.}:${KM_VMS_HOST_APP_DIR:-/host-app}
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vms-net

  recorder:
    image: ${COMPOSE_PROJECT_NAME:-tnas-vms}-recorder:${KM_VMS_RELEASE_IMAGE_TAG:-latest}
    build:
      context: ./apps/recorder
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-recorder
    restart: always
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-update:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
      DATABASE_URL: postgresql+psycopg://vms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/vms
      STORAGE_ROOT: /storage/archive
      DEFAULT_RECORD_STREAM: main
      SEGMENT_DURATION_SEC: 300
      FFMPEG_LOGLEVEL: warning
    volumes:
      - ${SURVEILLANCE_ROOT}:/storage/archive
    networks:
      - vms-net

  web:
    image: ${COMPOSE_PROJECT_NAME:-tnas-vms}-web:${KM_VMS_RELEASE_IMAGE_TAG:-latest}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-web
    restart: always
    depends_on:
      update-status-reader:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      TZ: ${TZ:-Asia/Yekaterinburg}
    networks:
      - vms-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ${KM_VMS_CONTAINER_PREFIX:-vms}-nginx
    restart: always
    depends_on:
      web:
        condition: service_started
      update-status-reader:
        condition: service_healthy
      update-retry-admission:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/update-recovery.html:/etc/nginx/update-recovery.html:ro
      - ${KM_VMS_HOST_APP_DIR:?KM_VMS_HOST_APP_DIR is required}/data/exports:/var/www/exports:ro
    networks:
      - vms-net

networks:
  vms-net:
    driver: bridge
