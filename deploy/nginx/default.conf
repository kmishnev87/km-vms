server {
    listen 80;
    server_name _;

    client_max_body_size 2g;
    resolver 127.0.0.11 ipv6=off valid=5s;
    set $api_upstream api:8000;

    location = /api/system/update/status {
        proxy_intercept_errors on;
        error_page 502 503 504 = @failure_update_status;
        proxy_pass http://$api_upstream/system/update/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    location = /api/system/update/apply/status {
        proxy_intercept_errors on;
        error_page 502 503 504 = @failure_update_apply_status;
        proxy_pass http://$api_upstream/system/update/apply/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    location = /api/system/update/apply {
        proxy_intercept_errors on;
        error_page 502 503 504 = @failure_update_apply;
        proxy_pass http://$api_upstream/system/update/apply;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    location = /api/system/update/apply/cancel {
        proxy_intercept_errors on;
        error_page 502 503 504 = @failure_update_cancel;
        proxy_pass http://$api_upstream/system/update/apply/cancel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_read_timeout 30;
    }

    location = /api/system/update/check {
        proxy_intercept_errors on;
        error_page 502 503 504 = @failure_update_check;
        proxy_pass http://$api_upstream/system/update/check;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_read_timeout 30;
    }

    location @failure_update_status {
        proxy_pass http://update-status-reader:8080;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    location @failure_update_apply_status {
        proxy_pass http://update-status-reader:8080;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    location @failure_update_apply {
        proxy_pass http://update-retry-admission:8080;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_pass_request_body on;
        proxy_set_header Host $host;
    }

    location @failure_update_cancel {
        proxy_pass http://update-retry-admission:8080;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Length 0;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
    }

    location @failure_update_check {
        proxy_pass http://update-retry-admission:8080;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Length 0;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
    }

    location ~ ^/api/(?<media_path>live/[0-9]+/(main|sub|sub2)/(index\.m3u8|seg_[0-9]+\.ts)|recordings/(stream|download)|chronology/file)$ {
        access_log off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location /exports/ {
        alias /var/www/exports/;
        autoindex off;
    }

    location /previews/ {
        rewrite ^/previews/(.*)$ /previews/$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location = /update-recovery {
        default_type text/html;
        alias /etc/nginx/update-recovery.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location /_next/ {
        proxy_pass http://web:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }
}
